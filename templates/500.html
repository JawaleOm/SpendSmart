{% extends "base.html" %}

{% block title %}500 — Server Error | SpendSmart{% endblock %}

{% block content %}
<div style="text-align: center; padding: 4rem 1rem; max-width: 500px; margin: 0 auto;">
  <div class="card" style="padding: 3rem 2rem;">
    <span style="font-size: 4rem; display: block; margin-bottom: 0.5rem;">⚠️</span>
    <h1 class="font-heading" style="font-size: 2.5rem; color: var(--red); margin-bottom: 0.5rem;">500</h1>
    <h2 class="font-heading" style="font-size: 1.4rem; margin-bottom: 0.75rem;">Internal Server Error</h2>
    <p style="color: var(--text-muted); font-size: 0.95rem; margin-bottom: 1.75rem;">
      Something went wrong on our end while processing your request. Please try again.
    </p>
    <a href="{{ url_for('dashboard') }}" class="btn btn-primary">
      <span>&larr; Back to Dashboard</span>
    </a>
  </div>
</div>
{% endblock %}
