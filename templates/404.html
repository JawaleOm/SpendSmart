{% extends "base.html" %}

{% block title %}404 — Page Not Found | SpendSmart{% endblock %}

{% block content %}
<div style="text-align: center; padding: 4rem 1rem; max-width: 500px; margin: 0 auto;">
  <div class="card" style="padding: 3rem 2rem;">
    <span style="font-size: 4rem; display: block; margin-bottom: 0.5rem;">🔍</span>
    <h1 class="font-heading" style="font-size: 2.5rem; color: var(--primary); margin-bottom: 0.5rem;">404</h1>
    <h2 class="font-heading" style="font-size: 1.4rem; margin-bottom: 0.75rem;">Page Not Found</h2>
    <p style="color: var(--text-muted); font-size: 0.95rem; margin-bottom: 1.75rem;">
      The page you are looking for doesn't exist or has been moved to a new URL.
    </p>
    <a href="{{ url_for('dashboard') }}" class="btn btn-primary">
      <span>&larr; Back to Dashboard</span>
    </a>
  </div>
</div>
{% endblock %}
