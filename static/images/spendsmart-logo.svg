<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <!-- Vibrant 3-stop Brand Gradient (Electric Purple -> Hot Pink -> Sunny Orange) -->
    <linearGradient id="ssBadgeGrad" x1="15%" y1="10%" x2="90%" y2="95%">
      <stop offset="0%" stop-color="#6C5CE7" />
      <stop offset="55%" stop-color="#FF6B9D" />
      <stop offset="100%" stop-color="#FFB347" />
    </linearGradient>

    <!-- Golden Coin Gradient -->
    <linearGradient id="ssCoinGrad" x1="20%" y1="15%" x2="80%" y2="85%">
      <stop offset="0%" stop-color="#FFEAA7" />
      <stop offset="50%" stop-color="#FDCB6E" />
      <stop offset="100%" stop-color="#E17055" />
    </linearGradient>

    <!-- Upward Growth Arrow Gradient -->
    <linearGradient id="ssArrowGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E8FBFF" />
    </linearGradient>

    <!-- Soft Glow Filter -->
    <filter id="ssGlow" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#6C5CE7" flood-opacity="0.38"/>
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#FF6B9D" flood-opacity="0.28"/>
    </filter>

    <!-- Coin Inner Shadow -->
    <filter id="coinGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#E17055" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Outer Glow Container -->
  <g filter="url(#ssGlow)">
    <!-- Squircle / Rounded Square Badge -->
    <rect x="20" y="20" width="160" height="160" rx="44" ry="44" fill="url(#ssBadgeGrad)"/>
    
    <!-- Subtle Inner Border Highlight -->
    <rect x="22" y="22" width="156" height="156" rx="42" ry="42" fill="none" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="2.5"/>

    <!-- Ambient Sparkle in top left of badge -->
    <path d="M46 44 L48.5 50.5 L55 53 L48.5 55.5 L46 62 L43.5 55.5 L37 53 L43.5 50.5 Z" fill="#FFFFFF" opacity="0.85"/>
  </g>

  <!-- Stylised Wallet Shape (Modern, sleek curved lines) -->
  <g id="wallet-group">
    <!-- Wallet Back/Flap -->
    <rect x="48" y="76" width="104" height="68" rx="18" ry="18" fill="#1B1736" fill-opacity="0.22" />
    
    <!-- Wallet Main Body (semi-translucent frosted glass effect) -->
    <rect x="48" y="82" width="104" height="64" rx="16" ry="16" fill="#FFFFFF" fill-opacity="0.94" stroke="#FFFFFF" stroke-width="1.5" />
    
    <!-- Wallet Card Accent Strip -->
    <rect x="58" y="70" width="84" height="18" rx="6" ry="6" fill="#00CEC9" fill-opacity="0.85" />
    <rect x="68" y="65" width="64" height="14" rx="5" ry="5" fill="#FFEAA7" fill-opacity="0.9" />

    <!-- Wallet Clasp / Badge Tab -->
    <path d="M128 102 H152 C157 102 160 106 160 112 C160 118 157 122 152 122 H128 Z" fill="#6C5CE7" />
    <circle cx="146" cy="112" r="4.5" fill="#FFFFFF" />
  </g>

  <!-- Golden Savings Coin Rising Upwards -->
  <g id="coin-group" filter="url(#coinGlow)">
    <circle cx="95" cy="74" r="24" fill="url(#ssCoinGrad)" stroke="#FFFFFF" stroke-width="2.5"/>
    <circle cx="95" cy="74" r="18" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-dasharray="3 2" opacity="0.8"/>
    <!-- Rupee / Upward Growth Symbol on Coin -->
    <text x="95" y="82" font-family="'Poppins', sans-serif" font-size="21" font-weight="800" fill="#FFFFFF" text-anchor="middle">₹</text>
  </g>

  <!-- Dynamic Upward Growth Arrow (Smart Saving Momentum) -->
  <g id="arrow-sparkle">
    <path d="M106 62 L124 44 M124 44 H112 M124 44 V56" stroke="url(#ssArrowGrad)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Top Sparkle Star -->
    <path d="M136 34 L138 39 L143 41 L138 43 L136 48 L134 43 L129 41 L134 39 Z" fill="#FFEAA7"/>
    <circle cx="145" cy="52" r="2" fill="#FFFFFF" opacity="0.9"/>
  </g>
</svg>
